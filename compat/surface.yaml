# Everything Claudette relies on from Claude Code (DESIGN.md §16, "The compatibility surface list").
#
# Rule: code that starts using something new from Claude Code adds an entry here in the same change.
# The daily compatibility check (compat/check.mjs) matches each `id` against new changelog entries and diffs.
#
# Fields:
#   id        the exact identifier, as it appears in Claude Code's output, docs or changelog
#   kind      flag | command | env | message | field | control | file | behavior
#   status    documented | undocumented | experimental
#   usedIn    source file(s) that depend on it, relative to the repo root
#   docs      the page that documents it (the check snapshots these pages)
#   test      the test class that covers it
#   fallback  what to do if it breaks (required for undocumented and experimental entries)

versions:
  minimum: 2.1.284     # ClaudeLocator.MinimumVersion
  lastTested: 2.1.284  # ClaudeLocator.LastTestedVersion; bump when a compatibility report is handled

