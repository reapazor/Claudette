name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The package workflow runs it before a tag's packages become a release.
  workflow_call:

permissions:
  contents: read

# A newer push to the same pull request or branch makes a running check pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            filter: Category!=RealCli&Category!=Live
          - os: macos-latest
            filter: Category!=RealCli&Category!=Live
          # Linux also runs the RealCli tests: the real Claude Code against the mock Messages API, with a dummy key and a
          # throwaway CLAUDE_CONFIG_DIR, so no account or tokens are involved (DESIGN.md §15). On the same runner as the
          # rest, rather than a job of its own that restores and builds again.
          - os: ubuntu-latest
            filter: Category!=Live
            real-cli: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Packages are cached by the lock files, and restored exactly as they say.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      # The version Claudette was last tested with (compat/surface.yaml), so a new Claude Code release can't turn a pull
      # request red; the daily compatibility check tries each new release (DESIGN.md §16). Tried three times, so one
      # failed download doesn't fail the run.
      - name: Install Claude Code
        if: ${{ matrix.real-cli }}
        # bash with pipefail: a failed download makes the attempt fail, rather than piping nothing into bash, which succeeds.
        shell: bash
        run: |
          version=$(sed -n 's/^[[:space:]]*lastTested:[[:space:]]*\([0-9.]*\).*/\1/p' compat/surface.yaml)
          echo "Installing Claude Code $version"
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 https://claude.ai/install.sh | bash -s "$version"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            sleep 10
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Claude Code version
        if: ${{ matrix.real-cli }}
        run: claude --version
      - name: Restore
        run: dotnet restore Claudette.slnx --locked-mode
      - name: Build
        run: dotnet build Claudette.slnx --no-restore --configuration Release
      # Live tests use real tokens and never run in CI. Where Claude Code is installed, a RealCli test that can't find it
      # fails rather than skips (CLAUDETTE_REQUIRE_CLAUDE), so the leg can't pass while running none of them.
      # A test that hangs fails the run after 10 minutes and names itself, rather than holding the runner for hours.
      - name: Test
        env:
          CLAUDETTE_REQUIRE_CLAUDE: ${{ matrix.real-cli && '1' || '' }}
        run: dotnet test Claudette.slnx --no-build --configuration Release --filter "${{ matrix.filter }}" --blame-hang-timeout 10m --blame-hang-dump-type none --logger trx --results-directory TestResults
      - name: Summary
        if: ${{ !cancelled() }}
        shell: bash
        run: node .github/scripts/test-summary.mjs TestResults "Tests (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
      # What a failure needs to be read without running it again: the results, which test hung, and a changed view's
      # snapshot (*.received.txt, DESIGN.md §15).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-results-${{ matrix.os }}
          path: |
            TestResults/
            tests/**/*.received.*
          retention-days: 7
          if-no-files-found: ignore

